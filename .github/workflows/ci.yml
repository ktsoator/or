name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          gofmt -w .
          git diff --exit-code

      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check Coding package versions
        run: |
          version=$(node -p "require('./coding/desktop/package.json').version")
          node scripts/set-version.mjs "$version" --check

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...

      - name: Check README Go version
        run: |
          mod=$(grep -E '^go [0-9]' go.mod | awk '{print $2}' | cut -d. -f1,2)
          grep -qF "Go $mod or later" README.md || {
            echo "README 'Go X or later' is out of sync with go.mod ($mod)"
            exit 1
          }

  test:
    name: Test (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: go.mod
            go-version-file: go.mod
          - label: stable
            go-version: stable

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          go-version-file: ${{ matrix.go-version-file }}
          cache: true

      - name: Test
        run: go test ./...

  race:
    name: Race test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: Test with race detector
        run: go test -race ./...

  coding-client:
    name: Coding client
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: coding/client
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: coding/client
        run: bun run lint

      - name: Test
        working-directory: coding/client
        run: bun run test

      - name: Build
        working-directory: coding/client
        run: bun run build

  coding-client-ui:
    name: Coding client UI
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: coding/client
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: coding/client
        run: bunx playwright install --with-deps chromium

      - name: Test UI
        working-directory: coding/client
        run: bun run test:ui

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coding-client-ui-test-results
          path: coding/client/test-results
          if-no-files-found: ignore

  coding-desktop:
    name: Coding desktop
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install desktop dependencies
        working-directory: coding/desktop
        run: bun install --frozen-lockfile

      - name: Check release artifact names
        working-directory: coding/desktop
        run: node scripts/check-artifact-names.mjs

      - name: Build desktop main process
        working-directory: coding/desktop
        run: bun run build:main

      - name: Build Go sidecar
        working-directory: coding/desktop
        run: bun run build:sidecar
